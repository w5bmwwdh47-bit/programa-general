<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de plagas y vectores</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--surf:#fff;--ink:#17252a;--mute:#5d6b70;--line:#d9dfdb;--green:#2f6f4f;--amber:#e0a100;--red:#b3402f;--ong:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12191b;--surf:#1b2528;--ink:#e7eeea;--mute:#9aa9a4;--line:#2c3a3d;--green:#5fb98a;--amber:#f0b429;--red:#e07a66;--ong:#0f1a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12191b;--surf:#1b2528;--ink:#e7eeea;--mute:#9aa9a4;--line:#2c3a3d;--green:#5fb98a;--amber:#f0b429;--red:#e07a66;--ong:#0f1a14}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;line-height:1.15}h1{font-size:26px;font-weight:800}h2{font-size:19px;font-weight:700}h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--green);color:var(--ong);flex-wrap:wrap}
.top b{font-weight:800;font-size:17px;flex:1;min-width:150px}
.top button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:6px 12px;cursor:pointer}
nav{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--surf)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--amber);font-weight:700}
main{max-width:980px;margin:0 auto;padding:20px 18px 48px}
.login{max-width:760px;margin:0 auto;padding:48px 18px}
.login p{color:var(--mute);margin:8px 0 28px;max-width:52ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.door{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:4px;padding:20px}
.door.t{border-left-color:var(--amber)}.door p{margin:6px 0 14px;font-size:14px}
.btn{background:var(--green);color:var(--ong);border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 24px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:4px;padding:14px}
.stat b{display:block;font-size:30px;font-weight:800}.stat span{color:var(--mute);font-size:13px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);flex:1;min-width:140px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{color:var(--mute);font-weight:500;font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.Pendiente{color:var(--mute)}.En-curso{color:var(--amber)}.Completada{color:var(--green)}
.bar{height:10px;background:var(--green);border-radius:2px;min-width:2px}
.job{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--mute);border-radius:4px;padding:14px;margin-bottom:12px}
.job.En-curso{border-left-color:var(--amber)}.job.Completada{border-left-color:var(--green)}
.job p{margin:4px 0;color:var(--mute);font-size:14px}.job .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mute);padding:18px 0}.note{font-size:13px;color:var(--mute);margin-top:24px}
.Entregada{color:var(--green)}.Despachada{color:var(--amber)}.Cerrado,.Vigente{color:var(--green)}.Vencido{color:var(--red)}.Por-vencer{color:var(--amber)}
.tw input,.tw select{min-width:80px}.tot{text-align:right;margin-top:12px;font-size:16px}.sec{display:flex;gap:8px;margin:0 0 14px}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 44px);cursor:cell}
.ev{position:absolute;box-sizing:border-box;padding:2px 5px;border-radius:4px;color:#fff;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;border:1px solid var(--surf)}
.gut{position:relative}.gut span{position:absolute;right:6px;font-size:11px;color:var(--mute)}
.chd{text-align:center;padding:6px 2px;font-size:13px;border-left:1px solid var(--line);cursor:pointer}.chd.tdy{border-bottom:3px solid var(--amber);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);min-width:640px}.mc{min-height:96px;border:1px solid var(--line);margin:-1px 0 0 -1px;padding:4px;cursor:pointer;overflow:hidden}.mc.o{opacity:.45}.mc.tdy{box-shadow:inset 0 0 0 2px var(--amber)}
.mchip{color:#fff;border-radius:3px;font-size:11px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media print{.top,nav,.noprint{display:none!important}:root{--bg:#fff!important;--surf:#fff!important;--ink:#000!important;--mute:#444!important;--line:#999!important}.panel{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="ctrl-plagas-v1",SERV=["Fumigación","Desratización","Control de vectores (Aedes)","Desinsectación","Desinfección"],
PLAGAS=["Cucarachas","Roedores","Mosquitos / Aedes aegypti","Hormigas","Moscas","Chinches","Otra"];
function seed(){return{clients:[{id:1,name:"Restaurante El Fogón",addr:"Cra 8 #12-30, Cali",tel:"315 000 0001"},{id:2,name:"Conjunto Los Almendros",addr:"Cl 5 #34-10, Cali",tel:"315 000 0002"},{id:3,name:"Bodega Distrisur",addr:"Autopista Sur km 2, Cali",tel:"315 000 0003"}],
techs:[{id:1,name:"Carlos Mejía",tel:"300 111 0001"},{id:2,name:"Laura Ospina",tel:"300 111 0002"}],
orders:[{id:1,cid:1,tech:1,svc:SERV[0],date:today(),hora:"08:00",dur:90,status:"Pendiente"},{id:2,cid:2,tech:1,svc:SERV[2],date:today(),hora:"10:30",dur:120,status:"Pendiente"},{id:3,cid:3,tech:2,svc:SERV[1],date:today(),hora:"09:00",dur:60,status:"Pendiente"}]}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var S,ses=null,tab="resumen",openId=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=seed();
S.prices=S.prices||{company:"EXTINPLAGAS Y FUMIGACIONES CALI",nit:"000.000.000-0",iva:19,valid:15,terms:"Valores en pesos colombianos. Pago: 50% anticipo y 50% al finalizar. Incluye personal, equipos e insumos. Los certificados de servicio se entregan al terminar.",items:[{id:1,n:"Fumigación general (por visita)",p:150000},{id:2,n:"Desratización",p:180000},{id:3,n:"Control de vectores (Aedes), por m²",p:2500},{id:4,n:"Desinsectación",p:140000},{id:5,n:"Desinfección, por m²",p:3000},{id:6,n:"Recarga extintor ABC 10 lb",p:30000}]};
S.quotes=S.quotes||[];S.fin=S.fin||[];S.ctl=S.ctl||[];S.del=S.del||[];S.rem=S.rem||{};S.remcfg=S.remcfg||{dias:45,cada:8,tpl:"Cordial saludo, {cliente}. Desde {empresa} le recordamos que tiene facturas pendientes de pago por un saldo de {saldo}: {facturas}. Agradecemos realizar el pago a la brevedad. Si ya lo hizo, por favor ignore este mensaje."};
S.prods=S.prods||[{id:1,n:"Extintor ABC 10 lb",p:95000},{id:2,n:"Extintor CO2 10 lb",p:320000},{id:3,n:"Extintor ABC 20 lb",p:160000},{id:4,n:"Insecticida concentrado 1 L",p:85000},{id:5,n:"Cebo raticida (kg)",p:38000},{id:6,n:"Gel para cucarachas 30 g",p:28000}];
if(S.prices.company=="Nombre de tu empresa"){S.prices.company="EXTINPLAGAS Y FUMIGACIONES CALI";save()}
var rv=null,ph=[];
var qd=null,qv=null,fsub="mov",fm="",ee=null,cf="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{alert("No se pudo guardar: el almacenamiento del navegador está lleno. Usa menos fotos.")}catch(x){}}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cl(i){return S.clients.find(function(c){return c.id==i})||{name:"—",addr:""}}
function tc(i){return(S.techs.find(function(c){return c.id==i})||{name:"—"}).name}
function chip(s){return '<span class="chip '+s.replace(" ","-")+'">'+s+'</span>'}
function nid(a){return a.reduce(function(m,x){return Math.max(m,x.id)},0)+1}
function opts(a,f){return a.map(function(x){return '<option value="'+(x.id||esc(x))+'">'+esc(f?f(x):x)+'</option>'}).join("")}
function v(id){return document.getElementById(id).value.trim()}

function render(){var h="";if(!ses&&lgv){document.getElementById("app").innerHTML=authView();return}
if(!ses){h='<div class="login"><h1>'+esc(S.prices.company)+'</h1><p>Plataforma interna de la empresa. Elige tu portal para registrar y consultar los servicios.</p><div class="doors">'+
'<div class="door"><h2>Portal de administración</h2><p>Crea órdenes, asigna técnicos, gestiona clientes y revisa los informes.</p><button class="btn" data-act="login-admin">Entrar como administrador</button></div>'+
'<div class="door t"><h2>Portal de técnicos</h2><p>Consulta tus servicios del día y registra lo aplicado en campo.</p><label>¿Quién eres?<select id="who">'+opts(S.techs,function(t){return t.name})+'</select></label><br><button class="btn" data-act="login-tech">Entrar como técnico</button></div></div>'+
'<p class="note">Versión de demostración: los datos se guardan solo en este navegador. Para uso real con varios usuarios se necesita un servidor y acceso con clave.</p></div>';
}else{
var adm=ses.role=="admin";
h='<div class="top"><b>'+(adm?"Administración":"Técnico: "+esc(tc(ses.id)))+'</b><button data-act="out">Cambiar portal</button></div>';
if(adm){h+='<nav>'+[["resumen","Resumen"],["ordenes","Órdenes"],["agenda","Calendario"],["cotiz","Cotizaciones"],["entregas","Entregas y ventas"],["finanzas","Finanzas"],["control","Fumigación y extintores"],["clientes","Clientes"],["tecnicos","Técnicos"],["respaldo","Respaldo y seguridad"]].map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</nav>'}
h+='<main>'+(rv?rview(rv):adm?admin():tech())+'</main>'}
document.getElementById("app").innerHTML=h}

function admin(){var o=S.orders,h="";if(tab=="agenda")return agenda();if(tab=="entregas")return entr();if(tab=="clientes"&&hc)return hoja();if(tab=="respaldo")return resp();if(tab=="cotiz")return cot();if(tab=="finanzas")return fin();if(tab=="control")return ctl();
if(tab=="resumen"){var c=function(s){return o.filter(function(x){return x.status==s}).length},mx=1,by={};
o.forEach(function(x){by[x.svc]=(by[x.svc]||0)+1;mx=Math.max(mx,by[x.svc])});
h='<h1>Resumen</h1><div class="stats"><div class="stat"><b>'+c("Pendiente")+'</b><span>Pendientes</span></div><div class="stat"><b>'+c("En curso")+'</b><span>En curso</span></div><div class="stat"><b>'+c("Completada")+'</b><span>Completadas</span></div><div class="stat"><b>'+S.clients.length+'</b><span>Clientes</span></div></div>'+
'<div class="panel"><h2>Órdenes por servicio</h2><br>'+(o.length?Object.keys(by).map(function(k){return '<div style="margin-bottom:10px">'+esc(k)+' ('+by[k]+')<div class="bar" style="width:'+by[k]/mx*100+'%"></div></div>'}).join(""):'<div class="empty">Aún no hay órdenes.</div>')+'</div>';
var d=o.filter(function(x){return x.status=="Completada"}).slice(-3).reverse();
h+='<div class="panel"><h2>Últimos informes de campo</h2>'+(d.length?d.map(rep).join(""):'<div class="empty">Cuando un técnico complete un servicio, su informe aparecerá aquí.</div>')+'</div>'}
if(tab=="ordenes"){h='<h1>Órdenes de servicio</h1><br><div class="panel"><h2>Nueva orden</h2><br><div class="row"><label>Cliente<select id="oc">'+opts(S.clients,function(x){return x.name})+'</select></label><label>Servicio<select id="os">'+opts(SERV)+'</select></label><label>Fecha<input type="date" id="od" value="'+today()+'"></label><label>Hora<input type="time" id="oh" value="08:00"></label><label>Duración<select id="ol"><option value="30">30 min</option><option value="60" selected>1 h</option><option value="90">1.5 h</option><option value="120">2 h</option><option value="180">3 h</option><option value="240">4 h</option></select></label><label>Técnico<select id="ot">'+opts(S.techs,function(x){return x.name})+'</select></label><button class="btn" data-act="add-order">Crear orden</button></div></div>'+
'<div class="panel tw">'+(o.length?'<table><tr><th>Fecha</th><th>Cliente</th><th>Servicio</th><th>Técnico</th><th>Estado</th><th></th></tr>'+o.slice().reverse().map(function(x){return '<tr><td>'+x.date+' '+(x.hora||"08:00")+'</td><td>'+esc(cl(x.cid).name)+'</td><td>'+esc(x.svc)+'</td><td>'+esc(tc(x.tech))+'</td><td>'+chip(x.status)+'</td><td>'+(x.rep?'<button class="btn alt sm" data-act="toggle" data-id="'+x.id+'">Informe</button>':'')+xbtn("o",x.id)+'</td></tr>'+(openId==x.id&&x.rep?'<tr><td colspan="6">'+rep(x)+'</td></tr>':'')}).join("")+'</table>':'<div class="empty">No hay órdenes. Crea la primera con el formulario.</div>')+'</div>'}
if(tab=="clientes"){h='<h1>Clientes</h1><br><div class="panel"><h2>Nuevo cliente</h2><br><div class="row"><label>Nombre<input id="cn"></label><label>Dirección<input id="ca"></label><label>Teléfono<input id="ct"></label><button class="btn" data-act="add-client">Agregar</button></div></div><div class="panel tw"><table><tr><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Servicios</th><th></th></tr>'+S.clients.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.addr)+'</td><td>'+esc(x.tel)+'</td><td>'+o.filter(function(y){return y.cid==x.id}).length+'</td><td><button class="btn alt sm" data-hc="'+x.id+'">Historial</button></td></tr>'}).join("")+'</table></div>'}
if(tab=="tecnicos"){h='<h1>Técnicos</h1><br><div class="panel"><h2>Nuevo técnico</h2><br><div class="row"><label>Nombre<input id="tn"></label><label>Teléfono<input id="tt"></label><button class="btn" data-act="add-tech">Agregar</button></div></div><div class="panel tw"><table><tr><th>Nombre</th><th>Teléfono</th><th>Pendientes</th><th>Completadas</th></tr>'+S.techs.map(function(x){var m=o.filter(function(y){return y.tech==x.id});return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.tel)+'</td><td>'+m.filter(function(y){return y.status!="Completada"}).length+'</td><td>'+m.filter(function(y){return y.status=="Completada"}).length+'</td></tr>'}).join("")+'</table></div>'}
return h}

function rep(x){var r=x.rep;return '<div style="padding:8px 0"><h3>'+esc(cl(x.cid).name)+' · '+esc(x.svc)+'</h3><p style="margin:4px 0;color:var(--mute)">Técnico: '+esc(tc(x.tech))+'. Plaga: '+esc(r.plaga)+'. Producto: '+esc(r.prod)+' ('+esc(r.dosis)+'). Área: '+esc(r.area)+' m².</p>'+(r.obs?'<p style="margin:4px 0">'+esc(r.obs)+'</p>':'')+'<button class="btn alt sm" data-act="rv-open" data-id="'+x.id+'">Ver informe completo</button></div>'}

function tech(){var m=S.orders.filter(function(x){return x.tech==ses.id}),h='<h1>Mis servicios</h1><br>';
if(!m.length)return h+'<div class="empty">No tienes servicios asignados. Cuando el administrador te asigne uno, aparecerá aquí.</div>';
m.sort(function(a,b){return(a.status=="Completada")-(b.status=="Completada")||a.date.localeCompare(b.date)});
return h+m.map(function(x){var c=cl(x.cid);
var a=x.status=="Pendiente"?'<button class="btn" data-act="start" data-id="'+x.id+'">Iniciar servicio</button>':x.status=="En curso"?'<button class="btn" data-act="toggle" data-id="'+x.id+'">'+(openId==x.id?"Cerrar formulario":"Registrar informe")+'</button>':'<button class="btn alt" data-act="rv-open" data-id="'+x.id+'">Ver informe</button>';
var f=x.status=="En curso"&&openId==x.id?'<h3 style="margin-top:14px">Informe del servicio</h3><div class="row" style="margin-top:8px"><label>Fecha<input type="date" id="fdt" value="'+today()+'"></label><label>Técnico<input value="'+esc(tc(ses.id))+'" readonly></label><label>Persona que atiende<input id="fw" placeholder="Nombre"></label><label>Cargo o relación<input id="fwc" placeholder="Ej. Administrador"></label><label style="flex-basis:100%">Actividad realizada<textarea id="fA" rows="2">'+esc(x.svc)+': </textarea></label><div style="flex-basis:100%"><div style="font-size:13px;color:var(--mute)">Plagas encontradas</div>'+PLAGAS.map(function(p){return '<label style="flex-direction:row;align-items:center;gap:6px;display:inline-flex;min-width:0;margin:4px 14px 0 0;color:var(--ink);flex:none"><input type="checkbox" class="pl" value="'+p+'" style="width:auto"> '+p+'</label>'}).join("")+'</div><label>Nivel de infestación<select id="fnv"><option>Bajo</option><option>Medio</option><option>Alto</option><option>Sin presencia</option></select></label><label>Áreas intervenidas<input id="fz" placeholder="Ej. cocina, bodega, patio"></label><label>Insecticida o producto<input id="fr" placeholder="Nombre comercial y lote"></label><label>Ingrediente activo<input id="fi"></label><label>Dosis<input id="fd" placeholder="Ej. 20 ml/L"></label><label>Método de aplicación<select id="fmet"><option>Aspersión</option><option>Nebulización</option><option>Termonebulización</option><option>Cebos o gel</option><option>Trampas</option><option>Otro</option></select></label><label>Área tratada (m²)<input id="fa" type="number" min="0"></label><div style="flex-basis:100%"><label>Fotos del servicio (hasta 6)<input type="file" id="fph" accept="image/*" multiple></label><div id="ph" class="row" style="margin-top:8px"></div></div><div class="noprint" style="flex-basis:100%"><div style="font-size:13px;color:var(--mute)">Firma de quien atiende (dibuja con el dedo)</div><canvas id="sg" width="360" height="140" style="background:#fff;border:1px solid var(--line);border-radius:6px;width:100%;max-width:360px;height:140px;touch-action:none;display:block;margin:6px 0"></canvas><button class="btn alt sm" data-sgc="1">Borrar firma</button></div><label style="flex-basis:100%">Observaciones<textarea id="fo" rows="2"></textarea></label><label style="flex-basis:100%">Recomendaciones para el cliente<textarea id="fc" rows="2"></textarea></label><label>Próxima visita<input type="date" id="fn"></label><button class="btn" data-act="finish" data-id="'+x.id+'">Completar servicio</button></div>':'';
return '<div class="job '+x.status.replace(" ","-")+'"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>'+esc(c.name)+'</h3>'+chip(x.status)+'</div><p>'+esc(x.svc)+' · '+x.date+' a las '+(x.hora||"08:00")+'</p><p>'+esc(c.addr)+(c.tel?' · '+esc(c.tel):'')+'</p>'+(x.rep?'<p>Informe enviado: '+esc(x.rep.plaga)+', '+esc(x.rep.prod)+'.</p>':'')+'<div class="act">'+a+'</div>'+f+'</div>'}).join("")}

document.addEventListener("click",function(e){var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
if(t.dataset.tab){tab=t.dataset.tab;openId=null;rv=null;return render()}
var a=t.dataset.act,id=+t.dataset.id,o=S.orders.find(function(x){return x.id==id});
if(a=="login-admin"){lgv=hasPw()?"pw":"setpw";aerr=""}
else if(a=="login-tech"){ses={role:"tech",id:+v("who")}}
else if(a=="out"){ses=null;openId=null;rv=null}

else if(t=="pw")f='<h2>Contraseña de administrador</h2><div class="row" style="margin-top:10px"><label>Contraseña<input type="password" id="pw1" autocomplete="current-password"></label><button class="btn" data-auth="in">Entrar</button></div><br><button class="btn alt sm" data-auth="forgot">Olvidé mi contraseña</button>';
else if(t=="rec")f='<h2>Tu código de recuperación</h2><p class="note" style="margin:6px 0 12px">Es la única forma de recuperar el acceso si olvidas la contraseña. Anótalo y guárdalo fuera de este equipo. No se vuelve a mostrar.</p><div class="stat"><b style="letter-spacing:2px;font-size:24px">'+rcode+'</b></div><br><button class="btn" data-auth="done">Ya lo guardé, continuar</button>';
else f='<h2>Recuperar acceso</h2><div class="row" style="margin-top:10px"><label>Código de recuperación<input id="rc1" autocomplete="off"></label><label>Nueva contraseña (mínimo 8)<input type="password" id="pw1" autocomplete="new-password"></label></div><br><button class="btn" data-auth="reset">Cambiar contraseña</button>';
return '<div class="login"><h1>'+esc(S.prices.company)+'</h1><br><div class="panel">'+f+m+'</div>'+(t=="rec"?'':'<button class="btn alt" data-auth="back">Volver</button>')+'</div>'}
function resp(){var d=S.lastBackup,old=!d||(dt(today())-dt(d))/864e5>7;
return '<h1>Respaldo y seguridad</h1>'+(bmsg?'<p style="margin:10px 0"><b>'+esc(bmsg)+'</b></p>':'')+'<br><div class="panel"><h2>Copia de seguridad</h2><p class="note" style="margin:6px 0 12px">Descarga todos tus datos (clientes, órdenes, informes con fotos, cotizaciones, finanzas, inventario y configuración) en un archivo. Guárdalo en un lugar seguro. No incluye la contraseña.</p><p style="margin:0 0 12px;color:var(--'+(old?'red':'mute')+')">'+(d?'Último respaldo: '+d+(old?'. Ya pasó más de una semana, conviene hacer uno nuevo.':''):'Aún no has descargado ningún respaldo.')+'</p><button class="btn" data-bk="dl">Descargar copia de seguridad</button></div>'+
'<div class="panel"><h2>Restaurar una copia</h2><p class="note" style="margin:6px 0 12px">Reemplaza todos los datos actuales por los del archivo. Descarga un respaldo antes de restaurar.</p><input type="file" id="bkf" accept=".json,application/json">'+(rb?'<p style="margin:12px 0">El archivo tiene '+(rb.clients||[]).length+' clientes, '+(rb.orders||[]).length+' órdenes, '+(rb.quotes||[]).length+' cotizaciones y '+(rb.fin||[]).length+' movimientos financieros.</p><button class="btn" data-bk="ok">Reemplazar mis datos</button> <button class="btn alt" data-bk="no">Cancelar</button>':'')+'</div>'+
'<div class="panel"><h2>Contraseña de administrador</h2><div class="row"><label>Contraseña actual<input type="password" id="cp0" autocomplete="current-password"></label><label>Nueva contraseña (mínimo 8)<input type="password" id="cp1" autocomplete="new-password"></label><button class="btn" data-auth="chg">Cambiar contraseña</button></div><p class="note">Esta contraseña controla la entrada al portal de administración desde este navegador. Es una barrera básica: no reemplaza un sistema con servidor, que es lo que se necesita para proteger datos desde varios equipos.</p></div>'}
async function dl(name,text){var d=null;try{d=await claude.use("downloads")}catch(e){}
if(d){try{await d.save({filename:name,data:text});return true}catch(e){if(e&&e.code=="declined")return false}}
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
document.addEventListener("click",async function(e){var t=e.target.closest("[data-auth]");if(!t)return;var a=t.dataset.auth,g=function(i){var el=document.getElementById(i);return el?el.value:""};aerr="";
try{if(a=="back"){lgv=null}
else if(a=="forgot"){lgv="forgot"}
else if(a=="in"){var P=PWG();if(P&&await kdf(g("pw1"),P.s)==P.h){fails=0;ses={role:"admin"};tab="resumen";lgv=null}else{fails++;await new Promise(function(r){setTimeout(r,Math.min(fails,5)*1000)});aerr="Contraseña incorrecta."}}
else if(a=="set"){var p=g("pw1");if(p.length<8)aerr="La contraseña debe tener mínimo 8 caracteres.";else if(p!=g("pw2"))aerr="Las contraseñas no coinciden.";else{rcode=await savePw(p);lgv="rec"}}
else if(a=="done"){ses={role:"admin"};tab="resumen";lgv=null;rcode=""}
else if(a=="reset"){var Q=PWG(),np=g("pw1");if(!Q||await kdf(g("rc1").replace(/[^A-Za-z0-9]/g,"").toUpperCase(),Q.rs)!=Q.rh){fails++;await new Promise(function(r){setTimeout(r,Math.min(fails,5)*1000)});aerr="El código de recuperación no es correcto."}else if(np.length<8)aerr="La contraseña debe tener mínimo 8 caracteres.";else{rcode=await savePw(np);lgv="rec"}}
else if(a=="chg"){var R=PWG(),n2=g("cp1");if(!R||await kdf(g("cp0"),R.s)!=R.h)bmsg="La contraseña actual no es correcta.";else if(n2.length<8)bmsg="La nueva contraseña debe tener mínimo 8 caracteres.";else{var c2=await savePw(n2);bmsg="Contraseña cambiada. Nuevo código de recuperación: "+c2+". Guárdalo; el anterior ya no sirve."}}
}catch(x){aerr="No se pudo completar. Intenta de nuevo.";bmsg=aerr}render()});
document.addEventListener("click",async function(e){var t=e.target.closest("[data-bk]");if(!t)return;var a=t.dataset.bk;
if(a=="dl"){var ok=await dl("respaldo-extinplagas-"+today()+".json",JSON.stringify({app:"extinplagas",version:1,fecha:new Date().toISOString(),datos:S}));if(ok){S.lastBackup=today();save();bmsg="Copia de seguridad generada."}}
else if(a=="ok"){S=rb;S.lastBackup=today();save();rb=null;location.reload();return}
else if(a=="no"){rb=null;bmsg=""}
render()});
document.addEventListener("change",function(e){var t=e.target;if(t.id!="bkf"||!t.files[0])return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result),d=o&&o.datos;if(!d||!Array.isArray(d.orders)||!Array.isArray(d.clients))throw 0;rb=d;bmsg=""}catch(x){rb=null;bmsg="El archivo no es una copia de seguridad válida."}render()};rd.readAsText(t.files[0])});
var xc=null,xt=null;
function xbtn(k,id){var on=xc==k+":"+id;return '<button class="btn alt sm" data-xd="'+k+':'+id+'"'+(on?' style="border-color:var(--red);color:var(--red)"':'')+'>'+(on?'¿Eliminar? Confirmar':'Eliminar')+'</button>'}
document.addEventListener("click",function(e){var t=e.target.closest("[data-xd]");if(!t)return;var k=t.dataset.xd;clearTimeout(xt);
if(xc!=k){xc=k;xt=setTimeout(function(){xc=null;render()},5000);render();return}
var p=k.split(":"),id=+p[1];xc=null;
if(p[0]=="o"){S.orders=S.orders.filter(function(o){return o.id!=id});if(cd&&cd.id==id)cd=null;if(rv==id)rv=null;if(openId==id)openId=null}
else if(p[0]=="e"){S.del=S.del.filter(function(o){return o.id!=id});if(dvw==id)dvw=null}
else if(p[0]=="q"){S.quotes=S.quotes.filter(function(o){return o.id!=id});if(qv==id)qv=null}
save();render()});
render();
</script>
