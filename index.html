var PLAG=[
{id:"cam",c:"Rastreros y arácnidos",n:"Cucaracha americana (Periplaneta americana)",d:"Cucaracha de gran tamaño (30 a 40 mm) y color pardo rojizo, de hábitos nocturnos. Se refugia en alcantarillas, cajas de registro, sótanos, ductos y áreas húmedas, y migra hacia cocinas y depósitos en busca de alimento. Contamina alimentos, utensilios y superficies, puede vehicular microorganismos como Salmonella y Escherichia coli, y sus alérgenos pueden agravar el asma. Indicios: avistamientos nocturnos, excrementos cilíndricos, ootecas (cápsulas de huevos) y olor aceitoso persistente."},
{id:"cal",c:"Rastreros y arácnidos",n:"Cucaracha alemana (Blattella germanica)",d:"Cucaracha pequeña (12 a 16 mm), de color pardo claro con dos bandas oscuras sobre el tórax. Es la especie de mayor capacidad reproductiva: la hembra transporta la ooteca hasta la eclosión. Prefiere cocinas, baños y zonas cálidas detrás de electrodomésticos, mesones y ductos. Contamina alimentos, puede vehicular bacterias patógenas y genera alérgenos. Indicios: puntos oscuros (excrementos) en bordes y esquinas, olor desagradable y presencia de ninfas; verla de día suele indicar una infestación alta."},
{id:"hor",c:"Rastreros y arácnidos",n:"Hormigas",d:"Insectos sociales que viven en colonias organizadas, con obreras que forman rastros hacia fuentes de alimento azúcarado, graso o proteico. Algunas especies de interior, como la hormiga faraón, anidan en paredes y ductos y son difíciles de erradicar. Contaminan alimentos, pueden causar picaduras o daños en instalaciones eléctricas y son especialmente críticas en hospitales y cocinas. Indicios: filas de obreras, nidos en grietas, jardineras o suelo y montículos de tierra."},
{id:"ter",c:"Rastreros y arácnidos",n:"Termitas",d:"Insectos sociales xilófagos que se alimentan de celulosa presente en madera, cartón y papel. Las subterráneas construyen túneles de barro; las de madera seca viven dentro de las piezas que consumen. El daño es progresivo y silencioso, y puede comprometer muebles, marcos, techos y estructuras. Indicios: túneles de barro en muros, alas desprendidas tras el enjambre, madera con sonido hueco al golpearla y excrementos granulares similares al aserrín fino."},
{id:"ara",c:"Rastreros y arácnidos",n:"Arañas",d:"Arácnidos depredadores que se alojan en rincones, bodegas, techos, jardines y zonas con poca circulación. La mayoría es inofensiva y controla otros insectos, pero algunas especies pueden causar picaduras de importancia médica y generan rechazo por su presencia. Indicios: telarañas, sacos de huevos, mudas y avistamientos en zonas oscuras. El control combina limpieza, sellado de accesos y tratamiento focalizado."},
{id:"chi",c:"Ectoparásitos",n:"Chinches de cama (Cimex lectularius)",d:"Insectos hematófagos de 4 a 5 mm que se alimentan de sangre humana, principalmente de noche. Se ocultan en colchones, somieres, cabeceros, costuras y grietas. Sus picaduras, en línea o en grupo, producen picazón, reacciones alérgicas y alteración del sueño; no está demostrado que transmitan enfermedades. Indicios: manchas oscuras en la ropa de cama, mudas, huevos, olor dulzón y picaduras al despertar. Requiere tratamiento integral y repetido."},
{id:"pul",c:"Ectoparásitos",n:"Pulgas",d:"Insectos ectoparásitos sin alas, de 2 a 3 mm, que saltan largas distancias y se alimentan de sangre de mascotas y personas. Sus larvas se desarrollan en alfombras, grietas y áreas de descanso de los animales. Causan picazón y dermatitis, y pueden transmitir parásitos como Dipylidium caninum. Indicios: picaduras agrupadas en tobillos y piernas, rascado frecuente en mascotas y residuos oscuros en su pelaje. El control exige tratar el ambiente y a los animales."},
{id:"gar",c:"Ectoparásitos",n:"Garrapatas",d:"Ácaros hematófagos; la garrapata marrón del perro (Rhipicephalus sanguineus) puede completar su ciclo dentro de viviendas y perreras. Se alojan en grietas, zócalos y camas de mascotas. Debilitan a los animales, pueden transmitir agentes como Ehrlichia y Babesia y, en algunas regiones, están asociadas a rickettsiosis humana. Indicios: ejemplares sobre el pelaje, en paredes o rincones cercanos a las mascotas. El control requiere tratamiento del ambiente y de los animales."},
{id:"mos",c:"Insectos voladores",n:"Moscas",d:"Insectos voladores atraídos por materia orgánica en descomposición, residuos y alimentos. Su ciclo, de huevo a adulto, puede completarse en una a dos semanas en clima cálido. Transmiten mecánicamente bacterias, virus y parásitos al posarse sobre excrementos y luego sobre alimentos o superficies, con riesgo para la inocuidad alimentaria. Indicios: adultos en puertas y ventanas, manchas puntiformes de excremento y larvas en residuos. El control se basa en saneamiento, exclusión y tratamiento de focos."},
{id:"pol",c:"Insectos voladores",n:"Polillas de productos almacenados",d:"Insectos cuyas larvas se alimentan de granos, harinas, frutos secos, alimento para mascotas y otros productos almacenados. Causan pérdidas económicas y contaminan los alimentos con excrementos, mudas y telarañas. Indicios: polillas volando en despensas y bodegas, larvas, capullos y hilos de seda en los empaques. El control combina inspección y descarte de producto infestado, limpieza profunda y tratamiento de refugios."},
{id:"avi",c:"Insectos voladores",n:"Avispas y abejas",d:"Insectos sociales que construyen nidos en aleros, techos, árboles, cavidades y estructuras. Su picadura es dolorosa y puede desencadenar reacciones alérgicas graves, incluida la anafilaxia, en personas sensibles. Las abejas son polinizadoras, por lo que, cuando es posible, se prioriza su reubicación. Indicios: tránsito constante de insectos hacia un punto, nidos visibles y zumbido en muros. La intervención debe realizarla personal capacitado con equipo de protección."},
{id:"aed",c:"Vectores de enfermedades",n:"Aedes aegypti",d:"Mosquito urbano de color oscuro con marcas blancas en el cuerpo y las patas. Es de hábitos diurnos, con mayor actividad al amanecer y al atardecer, y se reproduce en recipientes pequeños con agua limpia: llantas, floreros, tanques, canaletas y bebederos. Es el principal vector del dengue, el chikungunya y el Zika, y de la fiebre amarilla urbana. Indicios: adultos dentro de las viviendas, picaduras diurnas y larvas en depósitos. El control combina eliminación de criaderos, larvicidas y aplicación espacial."},
{id:"ano",c:"Vectores de enfermedades",n:"Anopheles",d:"Mosquito de hábitos crepusculares y nocturnos que se reproduce en aguas limpias con vegetación, como charcos, orillas de cuerpos de agua y cultivos inundados. Las hembras transmiten los parásitos Plasmodium causantes de la malaria. Su importancia sanitaria depende de la zona geográfica y de la presencia de casos. Indicios: picaduras nocturnas, adultos en reposo en paredes y larvas en cuerpos de agua. El control incluye manejo de criaderos, protección personal y aplicaciones dirigidas."},
{id:"cul",c:"Vectores de enfermedades",n:"Culex",d:"Mosquitos de hábitos nocturnos que se reproducen en aguas estancadas con materia orgánica, como alcantarillas, canales, pozos sépticos y charcos. Causan picaduras molestas y, según la región, pueden transmitir arbovirus y otros agentes. Indicios: zumbido y picaduras nocturnas, adultos en zonas oscuras y larvas en agua sucia. El control se centra en eliminar o tratar los criaderos y en la aplicación de adulticidas en zonas de reposo."},
{id:"fle",c:"Vectores de enfermedades",n:"Flebótomos (Lutzomyia)",d:"Insectos diminutos (2 a 3 mm), de aspecto piloso y vuelo corto y silencioso, activos al atardecer y de noche. Habitan zonas húmedas y sombreadas con materia orgánica, vegetación y grietas. Las hembras son vectores de la leishmaniasis. Indicios: picaduras que producen picazón intensa, presencia cerca de zonas boscosas o cultivos y ausencia de zumbido audible. El control combina manejo del entorno, protección personal y tratamiento de áreas de reposo."},
{id:"tri",c:"Vectores de enfermedades",n:"Triatominos (chinches picudas)",d:"Insectos hematófagos de hábitos nocturnos, como Rhodnius prolixus, que viven en grietas de paredes, techos de palma, madera y nidos de animales cercanos a viviendas. Son vectores de Trypanosoma cruzi, causante de la enfermedad de Chagas, que se transmite principalmente a través de sus deposiciones. Indicios: ejemplares en dormitorios, manchas de excremento en paredes y picaduras nocturnas. El control exige mejoras de vivienda y tratamiento residual."},
{id:"rat1",c:"Roedores",n:"Rata de alcantarilla (Rattus norvegicus)",d:"Roedor robusto, de 18 a 25 cm sin contar la cola, que excava madrigueras y habita alcantarillas, sótanos, patios y zonas bajas. Puede transmitir enfermedades como la leptospirosis y la salmonelosis, contamina alimentos con orina y heces y roe cables, tuberías y estructuras con riesgo de incendio. Indicios: excrementos de unos 20 mm, madrigueras, huellas de grasa en los recorridos, roídos y sonidos nocturnos."},
{id:"rat2",c:"Roedores",n:"Rata de techo (Rattus rattus)",d:"Roedor esbelto y ágil trepador, con cola más larga que el cuerpo, que habita techos, cielos rasos, árboles, ductos y partes altas de las edificaciones. Contamina alimentos y superficies, roe cables y materiales, y puede transmitir enfermedades como la leptospirosis y la salmonelosis. Indicios: ruidos en techos al anochecer, excrementos fusiformes, roídos en partes altas y rastros de grasa en vigas y tuberías."},
{id:"rat3",c:"Roedores",n:"Ratón doméstico (Mus musculus)",d:"Roedor pequeño (7 a 10 cm), de gran capacidad reproductiva, que puede ingresar por aberturas de apenas 6 mm. Se alimenta de forma fraccionada y contamina mucho más de lo que consume con orina, heces y pelos. Puede transmitir bacterias como Salmonella y causar daños en empaques, cableado y aislamientos. Indicios: excrementos de 3 a 6 mm, empaques roídos, nidos de papel y sonidos en paredes y techos."},
{id:"pal",c:"Aves",n:"Palomas",d:"Aves urbanas (Columba livia) que anidan en cornisas, techos, ductos y estructuras. La acumulación de excrementos favorece el desarrollo de hongos y bacterias, como Histoplasma y Cryptococcus, además de ácaros y parásitos, y deteriora fachadas, canaletas y equipos. Indicios: nidos, plumas, acumulación de excrementos y ruido en techos. El manejo se basa en medidas de exclusión y disuasión no letales, y en la limpieza y desinfección de las áreas afectadas."}

/* ---- Lectura de RUT: primero lectura directa del PDF (sin IA), luego IA si está disponible ---- */
function parseRut(I){
var LB=/^\d{1,2}\.\s/;
function lab(re){return I.find(function(i){return re.test(i.s.trim())})}
function nextX(l){var c=I.filter(function(i){return LB.test(i.s.trim())&&Math.abs(i.y-l.y)<5&&i.x>l.x+5}).map(function(i){return i.x});return c.length?Math.min.apply(null,c)-4:l.x+420}
function below(l,x0,x1){if(!l)return[];x0=x0==null?l.x-3:x0;x1=x1==null?nextX(l):x1;return I.filter(function(i){return i!==l&&i.y<=l.y-5&&i.y>l.y-20&&i.x>=x0&&i.x<x1&&!LB.test(i.s.trim())}).sort(function(a,b){return a.x-b.x})}
function txt(a){return a.filter(function(i){return!/^[\d\s]+$/.test(i.s)}).map(function(i){return i.s.trim()}).join(" ").replace(/\s+/g," ").trim()}
function dig(a){return a.map(function(i){return i.s}).join("").replace(/\D/g,"")}
function same(l,x0,x1){if(!l)return[];return I.filter(function(i){return i!==l&&Math.abs(i.y-l.y)<=3&&i.x>=x0&&i.x<x1&&!LB.test(i.s.trim())}).sort(function(a,b){return a.x-b.x})}
function cap(s){return s.toLowerCase().replace(/(^|\s)([a-záéíóúñü])/g,function(m,a,b){return a+b.toUpperCase()})}
var l5=lab(/^5\.\s*N.mero de Identificaci.n Tributaria/),l6=lab(/^6\.\s*DV/),l12=lab(/^12\./),o={};
if(l5){o.nit=dig(below(l5,l5.x-3,l6?l6.x-3:l5.x+150));if(l6)o.dv=dig(below(l6,l6.x-3,l12?l12.x:l6.x+25))}
var l35=lab(/^35\.\s*Raz.n social/),rz=l35?txt(below(l35,l35.x-3,l35.x+500)):"";
var pers=[txt(below(lab(/^33\./))),txt(below(lab(/^34\./))),txt(below(lab(/^31\./))),txt(below(lab(/^32\./)))].filter(Boolean).join(" ");
o.nombre=rz||cap(pers);
var l24=lab(/^24\./);o.tipo=/jur.dica/i.test(txt(below(l24)))?"Persona jurídica":(l24?"Persona natural":"");
o.direccion=txt(below(lab(/^41\./),null,null));o.departamento=txt(below(lab(/^39\./)));o.ciudad=txt(below(lab(/^40\./)));
var em=I.map(function(i){return i.s.match(/[\w.+\-]+@[\w\-]+(\.[\w\-]+)+/)}).filter(Boolean)[0];o.correo=em?em[0]:"";
var l44=lab(/^44\./),l45=lab(/^45\./);o.telefono=l44?dig(same(l44,l44.x+40,l45?l45.x:l44.x+400)):"";o.telefono2=l45?dig(same(l45,l45.x+40,l45.x+400)):"";
var l46=lab(/^46\./),l47=lab(/^47\./);o.actividad=l46?dig(below(l46,l46.x-12,l47?l47.x-6:l46.x+40)).slice(0,4):"";
return o}
async function pdfItems(f){var b=await f.arrayBuffer();pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;var d=await pdfjsLib.getDocument({data:b}).promise,c=await(await d.getPage(1)).getTextContent();return c.items.filter(function(i){return String(i.str).trim()}).map(function(i){return{s:i.str,x:i.transform[4],y:i.transform[5]}})}
async function rutData(f){var isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name),o=null;
if(isPdf){try{await loadPdf();for(var k=0;k<50&&!window.pdfjsLib;k++)await new Promise(function(r){setTimeout(r,100)});o=parseRut(await pdfItems(f))}catch(e){o=null}}
if(!o||!(o.nit||o.nombre)){o=null;var sm=await samp();if(sm){try{var PR='Extrae los datos de este RUT colombiano (DIAN). Responde SOLO un JSON con las claves: nombre (razón social si es persona jurídica; si es persona natural: primer nombre, otros nombres, primer apellido y segundo apellido en ese orden), nit (número sin dígito de verificación), dv, direccion (casilla 41), ciudad, departamento, correo, telefono (casilla 44), actividad (código de actividad principal, casilla 46). Usa "" si un dato no aparece. No inventes datos.';o=isPdf?await sm.json(PR+"\n\nTEXTO DEL DOCUMENTO:\n"+await pdfText(f)):await sm.json(PR,{images:[f]})}catch(e){o=null}}}
return o&&(o.nit||o.nombre)?o:null}
